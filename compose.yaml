services:
  heartbeat:
    build: .
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - heartbeat-data:/data
      - ./secrets:/run/secrets:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 35s
    healthcheck:
      test: ["CMD", "last-heartbeat", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  heartbeat-data:

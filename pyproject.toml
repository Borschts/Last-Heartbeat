[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "last-heartbeat"
version = "0.1.0"
description = "Everyone deserves a dignified farewell."
requires-python = ">=3.12"
dependencies = ["Telethon==1.45.0", "httpx==0.28.1", "tzdata>=2025.2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.11,<1"]

[project.scripts]
last-heartbeat = "last_heartbeat.cli:main"

[tool.setuptools.packages.find]
include = ["last_heartbeat*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
